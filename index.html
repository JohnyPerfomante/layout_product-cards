<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Product card</title><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel=stylesheet><link rel=stylesheet href=layout_product-cards.2d290cac.css><body>

      <div class=card data-qa=card>

        <div class=card__stars>

            <span class=stars__star></span>
            <span class=stars__star></span>
            <span class=stars__star></span>
            <span class=stars__star></span>

          <span class=card__price-label>Price:</span>

          <span class=card__price-value>$2,199</span>

        <a href=# class=card__buy data-qa=hover>
          BUY
        </a>
      </div>
    </section>

    <script src=layout_product-cards.4d5a71a7.js></script>
